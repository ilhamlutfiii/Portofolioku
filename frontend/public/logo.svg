<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  
  <!-- Latar Belakang Kotak Melengkung -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Simbol Kurung Siku Kiri -->
  <text x="75" y="325" font-family="monospace" font-size="240" font-weight="bold" fill="#38bdf8">&lt;</text>
  
  <!-- Inisial IL -->
  <text x="180" y="325" font-family="sans-serif" font-size="190" font-weight="900" fill="url(#textGrad)">IL</text>
  
  <!-- Simbol Garis Miring & Kurung Siku Kanan -->
  <text x="365" y="325" font-family="monospace" font-size="240" font-weight="bold" fill="#818cf8">&gt;</text>
</svg>
